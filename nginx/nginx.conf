# nginx reverse proxy for the Multi-Agent Compliance Platform.
#
# Design decisions:
#   - /api/* proxied to Spring Boot (app:8080); all other paths serve the React SPA.
#   - try_files with index.html fallback enables React Router client-side routing.
#   - gzip enabled for JS/CSS bundles — significant bandwidth savings for Recharts.
#   - proxy_read_timeout 120s covers long LLM calls (chat, pipeline trigger).
#   - Security headers: X-Frame-Options, X-Content-Type-Options, Referrer-Policy.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Log format with request time for LLM endpoint monitoring
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    upstream backend {
        server app:8080;
    }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Proxy /api/* → Spring Boot
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;   # LLM calls can be slow
            proxy_send_timeout 120s;
        }

        # Proxy /actuator/* for health checks (internal use — restrict if public)
        location /actuator/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            allow 127.0.0.1;
            deny  all;
        }

        # React SPA — serve static files, fall back to index.html for client-side routing
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;

            # Cache hashed JS/CSS bundles long-term; index.html must not be cached
            location ~* \.(js|css|png|svg|ico|woff2?)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}
