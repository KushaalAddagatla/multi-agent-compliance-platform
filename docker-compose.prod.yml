# Production Docker Compose — no LocalStack, no pgAdmin, no source mounts.
# Run with: docker-compose -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   1. Run scripts/fetch-secrets.sh to populate .env.prod
#   2. Set ECR_IMAGE to the full ECR URI (e.g., 123456789.dkr.ecr.us-east-1.amazonaws.com/compliance:latest)
#   3. Ensure EC2 instance role has read access to the S3 bucket, SQS queue, SES, CloudWatch

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: compliance-postgres
    env_file: .env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-compliance}
      POSTGRES_USER: ${POSTGRES_USER:-compliance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-compliance} -d ${POSTGRES_DB:-compliance}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    image: ${ECR_IMAGE}
    container_name: compliance-app
    env_file: .env.prod
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-compliance}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-compliance}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    # Not exposed directly — nginx fronts all traffic

  nginx:
    build: ./nginx
    container_name: compliance-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro   # Certbot certs (optional; comment out if HTTP-only)
    restart: unless-stopped

volumes:
  postgres_data:
